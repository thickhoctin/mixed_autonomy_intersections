# Test configuration for four-way intersection with 50% penetration rate
av_frac: 0.5 # 50% autonomous vehicles
directions: 4way 
n_cols: 1 # 1x1 grid
n_rows: 1
opt: Adam # Optimizer
alg: PPO # Proximal Policy Optimization
chain_lr: True # Enable left and right turn 
pclip: 0.2 # Standard PPO clipping 0.2
lr: 0.001 # Increase learning rate
vcoef: 1 # Value function coefficient
n_rollouts_per_step: 48 # Number of rollouts per training step
layers: 
  - 192
  - leaky_relu
  - 128
  - leaky_relu
use_poisson: True # Enable Poisson flow
adv_norm: False # Disable advantage normalization
load_step: 0 # Load from step 0
# Increase flow rates for four-way intersection from 700 to 850
worker_kwargs:
worker_kwargs:
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
- flow_rate_h: 700
  flow_rate_v: 700
# Change action space from continuous to discrete with 5 actions
n_actions: 5 # Change from 3 to 5 discrete actions
# Increase collision coefficient from 20.0 to 50.0
collision_coef: 50.0 # Collision penalty coefficient

lam: 0.95 # GAE lambda
n_gds: 20 # Gradient descent steps per batch
vclip: 0.5 # Value function clipping

# Change from 10.12:
# rework collsion penalty to nearby penalty
# reward for RL vehicles close arrived vehicles
# using ray to train parallelly with multiple workers
use_ray: True # Enable Ray 
n_workers: 8 # Number of parallel workers
use_critic: True # Enable critic on workers
# change kltarg from 0.01 to 0.005
kltarg : 0.005 # KL target
# increase entropy coefficient from 0.001 to 0.003
entcoef: 0.003 # Entropy coefficient to try to improve exploration